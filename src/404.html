<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<title>404 | {{name}}</title>
<link rel="icon" href="/logo.png" />
<link rel="stylesheet" href="/fonts.css" />
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:#07090d;color:#e6edf3;font:16px/1.9 'Vazirmatn','Inter',sans-serif;text-align:center}
  main{max-width:420px}
  img{width:84px;height:84px;margin:0 auto 1rem;display:block}
  h1{margin:0;font:700 4.5rem/1 'Inter',sans-serif;letter-spacing:.04em;background:linear-gradient(95deg,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:.6rem 0 0;color:#9fb0c0}
  a{display:inline-block;margin-top:1.4rem;padding:.65rem 1.4rem;border-radius:999px;color:#fff;text-decoration:none;font-weight:600;background:linear-gradient(135deg,#2563eb,#7c3aed)}
  a:focus-visible{outline:2px solid #38bdf8;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="{{name}}" width="84" height="84" />
  <h1>404</h1>
  <p>صفحه‌ای که دنبالش بودی پیدا نشد.</p>
  <p dir="ltr" lang="en">The page you are looking for does not exist.</p>
  <a href="/">{{name}} ←</a>
</main>
</body>
</html>
